        {
          "@type": "TouristDestination",
          "@id": "https://kongo-explorer.vercel.app/#destination",
          "name": "Kongo Central",
          "description": "Province côtière et historique de la République Démocratique du Congo riche en biodiversité, chutes de Zongo, grottes et patrimoine fluvial.",

          "geo": {
            "@type": "GeoCoordinates",
            "latitude": -5.8422,
            "longitude": 13.4542
          },
          "includesAttraction": [
            {
              "@type": "TouristAttraction",
              "name": "Chutes de Zongo",
              "description": "Chutes d'eau spectaculaires d'environ 65 mètres nichées dans la forêt équatoriale.",
              "url": "https://kongo-explorer.vercel.app/destinations/zongo"
            },
            {
              "@type": "TouristAttraction",
              "name": "Jardin Botanique de Kisantu",

            },
            {
              "@type": "TouristAttraction",
              "name": "Pont Maréchal Mobutu",

              "url": "https://kongo-explorer.vercel.app/destinations/pont_marechal"
            }
          ]
        }
      ]
    }
